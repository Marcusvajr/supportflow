name: temporary-security-fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply npm security fix
        run: npm audit fix

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit updated lockfile
        run: |
          if git diff --quiet; then
            echo "No dependency changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/web/package.json apps/api/package.json
          git commit -m "fix: atualizar dependencias vulneraveis"
          git push
