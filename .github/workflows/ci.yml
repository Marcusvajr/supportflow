name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Static checks
        run: set -o pipefail; npm run lint 2>&1 | tee lint-output.txt

      - name: Upload static-check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
          retention-days: 3

      - name: Unit tests
        run: set -o pipefail; npm run test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 3

      - name: Build
        run: set -o pipefail; npm run build 2>&1 | tee build-output.txt

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
          retention-days: 3

      - name: Build API container
        run: docker build -f apps/api/Dockerfile -t supportflow-api:ci .

      - name: Build web container
        run: docker build -f apps/web/Dockerfile -t supportflow-web:ci .

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # O fluxo autenticado real usa contas de desenvolvimento do Clerk e
      # permanece no comando local `npm run test:e2e`. No CI padrao executamos
      # somente os smoke tests que nao dependem de credenciais externas.
      - name: E2E smoke tests
        run: npx playwright test --project=chromium
